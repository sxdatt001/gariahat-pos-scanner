<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#315d9e">
  <title>Gariahat POS Scanner</title>

  <!-- QR decoder. This page must be hosted on HTTPS (for example GitHub Pages). -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #f5f5f5;
      color: #222;
      font-family: Arial, Helvetica, sans-serif;
    }
    .app {
      max-width: 520px;
      margin: 0 auto;
      min-height: 100vh;
      padding: 18px;
      padding-top: max(18px, env(safe-area-inset-top));
      padding-bottom: max(18px, env(safe-area-inset-bottom));
    }
    .header { text-align: center; margin-bottom: 16px; }
    .header h1 { margin: 0; font-size: 25px; }
    .header p { margin: 6px 0 0; color: #666; font-size: 14px; }

    .card {
      background: white;
      border-radius: 14px;
      padding: 16px;
      box-shadow: 0 1px 6px rgba(0,0,0,.12);
    }
    #reader {
      width: 100%;
      overflow: hidden;
      border-radius: 12px;
      background: #111;
    }
    #reader video {
      object-fit: cover !important;
      border-radius: 12px;
    }
    .status {
      margin-top: 14px;
      min-height: 22px;
      text-align: center;
      font-size: 15px;
      line-height: 1.4;
    }
    .ok { color: #08783e; }
    .error { color: #b00020; }
    .hint {
      margin: 12px 0 0;
      color: #666;
      font-size: 13px;
      text-align: center;
      line-height: 1.45;
    }
    button {
      width: 100%;
      border: 0;
      border-radius: 10px;
      padding: 14px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }
    #startBtn {
      margin-top: 14px;
      background: #0b6bcb;
      color: white;
    }
    #cancelBtn {
      margin-top: 10px;
      background: #e9e9e9;
      color: #222;
    }
  </style>
</head>

<body>
<div class="app">
  <div class="header">
    <h1>Gariahat Online</h1>
    <p>Scan Product</p>
  </div>

  <div class="card">
    <div id="reader"></div>

    <div id="status" class="status">Starting rear camera…</div>

    <p class="hint">
      Hold the product QR inside the camera view. It will scan automatically.
      No photo is required.
    </p>

    <button id="startBtn" type="button" onclick="startScanner()" style="display:none;">
      📷 START CAMERA
    </button>

    <button id="cancelBtn" type="button" onclick="returnToPOS()">
      CANCEL / RETURN TO POS
    </button>
  </div>
</div>

<script>
  const POS_URL = "https://script.google.com/macros/s/AKfycbyL59emy_24Ii7jjW7fL7JS5m94VPHc_Q0uycvrW2Fr66uIEm2Ut9fm-1YzGfxBnZg9/exec";

  let scanner = null;
  let scanning = false;
  let returning = false;

  function setStatus(message, type) {
    const el = document.getElementById("status");
    el.textContent = message || "";
    el.className = "status" + (type ? " " + type : "");
  }

  function extractSku(rawValue) {
    const raw = String(rawValue || "").trim();
    if (!raw) return "";

    // Existing labels: https://.../exec?sku=GO-APP-SCF-0004
    try {
      const url = new URL(raw);
      const fromUrl = (url.searchParams.get("sku") || "").trim();
      if (fromUrl) return fromUrl;
    } catch (e) {
      // Not a URL; continue and treat it as a possible raw SKU.
    }

    // Future/simple labels containing only GO-... SKU.
    const match = raw.match(/\bGO-[A-Z0-9-]+\b/i);
    return match ? match[0].toUpperCase() : "";
  }

  async function stopScanner() {
    if (!scanner || !scanning) return;
    try {
      await scanner.stop();
    } catch (e) {}
    try {
      await scanner.clear();
    } catch (e) {}
    scanning = false;
  }

  async function handleScan(decodedText) {
    if (returning) return;

    const sku = extractSku(decodedText);
    if (!sku) {
      setStatus("QR detected, but it does not contain a Gariahat SKU. Try again.", "error");
      return;
    }

    returning = true;
    setStatus("Scanned " + sku + ". Returning to POS…", "ok");

    await stopScanner();

    // Preserve only the SKU. Apps Script then uses its existing lookup workflow.
    window.location.replace(POS_URL + "?sku=" + encodeURIComponent(sku));
  }

  async function startScanner() {
    if (scanning || returning) return;

    const startBtn = document.getElementById("startBtn");
    startBtn.style.display = "none";
    setStatus("Starting rear camera…");

    if (!window.isSecureContext) {
      setStatus("Camera requires an HTTPS page.", "error");
      startBtn.style.display = "block";
      return;
    }

    if (typeof Html5Qrcode === "undefined") {
      setStatus("QR scanner library did not load. Check your internet connection and reload.", "error");
      startBtn.style.display = "block";
      return;
    }

    scanner = new Html5Qrcode("reader");

    const config = {
      fps: 12,
      qrbox: function(viewfinderWidth, viewfinderHeight) {
        const edge = Math.floor(Math.min(viewfinderWidth, viewfinderHeight) * 0.72);
        return { width: edge, height: edge };
      },
      aspectRatio: 1.0,
      disableFlip: false
    };

    try {
      await scanner.start(
        { facingMode: { exact: "environment" } },
        config,
        handleScan,
        function() { /* normal scan misses are intentionally ignored */ }
      );
      scanning = true;
      setStatus("Ready — point the camera at a product QR.");
    } catch (firstError) {
      // Some iPhones/browsers reject "exact". Retry with a softer rear-camera request.
      try {
        await scanner.start(
          { facingMode: "environment" },
          config,
          handleScan,
          function() {}
        );
        scanning = true;
        setStatus("Ready — point the camera at a product QR.");
      } catch (secondError) {
        scanning = false;
        setStatus(
          "Could not open the camera. In Safari, allow Camera for this scanner website, then tap START CAMERA.",
          "error"
        );
        startBtn.style.display = "block";
      }
    }
  }

  async function returnToPOS() {
    if (returning) return;
    returning = true;
    await stopScanner();
    window.location.replace(POS_URL);
  }

  window.addEventListener("load", startScanner);

  window.addEventListener("pagehide", function() {
    if (scanner && scanning) {
      scanner.stop().catch(function(){});
    }
  });
</script>
</body>
</html>
