<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#315d9e">
<title>Gariahat POS Scanner v3</title>
<script src="https://unpkg.com/@zxing/browser@latest"></script>
<style>
*{box-sizing:border-box} body{margin:0;background:#f5f5f5;font-family:Arial,sans-serif;color:#222}
.app{max-width:520px;margin:auto;min-height:100vh;padding:18px;padding-top:max(18px,env(safe-area-inset-top))}
h1{text-align:center;margin:0;font-size:25px} .sub{text-align:center;color:#666;margin:5px 0 15px}
.card{background:#fff;padding:15px;border-radius:14px;box-shadow:0 1px 6px #0002}
video{display:block;width:100%;min-height:320px;max-height:65vh;object-fit:cover;background:#111;border-radius:12px}
#status{text-align:center;min-height:24px;margin:13px 0 5px;line-height:1.4}
.ok{color:#08783e}.err{color:#b00020}
#raw{display:none;margin:9px 0;padding:9px;background:#f1f1f1;border-radius:8px;font-size:12px;word-break:break-all}
.hint{text-align:center;color:#666;font-size:13px;line-height:1.4}
button{width:100%;border:0;border-radius:10px;padding:14px;font-weight:bold;font-size:16px;margin-top:10px}
.primary{background:#0b6bcb;color:#fff}.secondary{background:#e9e9e9}
</style>
</head>
<body>
<div class="app">
<h1>Gariahat Online</h1>
<div class="sub">ZXing Product Scanner — v3</div>
<div class="card">
<video id="video" playsinline muted></video>
<div id="status">Starting rear camera…</div>
<div id="raw"></div>
<p class="hint">Point the rear camera at the QR and hold steady. Try roughly 6–12 inches away.</p>
<button id="retry" class="primary" style="display:none" onclick="start()">📷 RETRY SCANNER</button>
<button class="secondary" onclick="cancel()">CANCEL / RETURN TO POS</button>
</div>
</div>
<script>
const POS_URL="https://script.google.com/macros/s/AKfycbyL59emy_24Ii7jjW7fL7JS5m94VPHc_Q0uycvrW2Fr66uIEm2Ut9fm-1YzGfxBnZg9/exec";
let reader=null, controls=null, returning=false;

function msg(t,c=""){const e=document.getElementById("status");e.textContent=t;e.className=c}
function showRaw(t){const e=document.getElementById("raw");e.style.display="block";e.textContent="Decoded QR: "+t}
function skuFrom(raw){
 raw=String(raw||"").trim();
 try { const u=new URL(raw); const s=(u.searchParams.get("sku")||"").trim(); if(s)return s.toUpperCase(); } catch(e){}
 const m=raw.match(/\bGO-[A-Z0-9-]+\b/i);
 return m?m[0].toUpperCase():"";
}
function stop(){
 try{if(controls)controls.stop()}catch(e){}
 controls=null;
}
function handle(result){
 if(!result||returning)return;
 const raw=typeof result.getText==="function"?result.getText():String(result.text||result);
 showRaw(raw);
 const sku=skuFrom(raw);
 if(!sku){msg("QR decoded, but no GO- SKU was found. Keep scanning.","err");return}
 returning=true; msg("Scanned "+sku+" — returning to POS…","ok"); stop();
 setTimeout(()=>location.replace(POS_URL+"?sku="+encodeURIComponent(sku)),250);
}
async function start(){
 returning=false; stop();
 document.getElementById("retry").style.display="none";
 document.getElementById("raw").style.display="none";
 msg("Starting rear camera…");
 try{
   if(!window.ZXingBrowser) throw new Error("ZXing library did not load");
   reader=new ZXingBrowser.BrowserQRCodeReader(undefined,{
     delayBetweenScanAttempts:100,
     delayBetweenScanSuccess:300
   });
   const constraints={
     audio:false,
     video:{
       facingMode:{ideal:"environment"},
       width:{ideal:1280},
       height:{ideal:720}
     }
   };
   controls=await reader.decodeFromConstraints(
     constraints,
     document.getElementById("video"),
     (result,error,ctrl)=>{ if(result)handle(result); }
   );
   msg("Ready — point camera at a product QR.");
 }catch(e){
   console.error(e);
   msg("Scanner could not start: "+(e.message||e),"err");
   document.getElementById("retry").style.display="block";
 }
}
function cancel(){returning=true;stop();location.replace(POS_URL)}
window.addEventListener("load",start);
window.addEventListener("pagehide",stop);
</script>
</body>
</html>
